name: Swift package builds

on:
  push:
    branches:
      - swift-gentl-api
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - GenTLAPI
          - GenTLNative
          - AmcamGenTL
          - GenTLRouter
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build package
        run: swift build --package-path "swift/Packages/${{ matrix.package }}"
