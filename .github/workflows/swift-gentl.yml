name: Swift GenTL packages

on:
  push:
    branches:
      - swift-gentl-api
    paths:
      - "swift/Packages/**"
      - ".github/workflows/swift-gentl.yml"
  pull_request:
    branches:
      - swift-gentl-api
    paths:
      - "swift/Packages/**"
      - ".github/workflows/swift-gentl.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    name: ${{ matrix.package }} tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: GenTLAPI
            path: swift/Packages/GenTLAPI
          - package: GenTLNative
            path: swift/Packages/GenTLNative
          - package: AmcamGenTL
            path: swift/Packages/AmcamGenTL
          - package: GenTLRouter
            path: swift/Packages/GenTLRouter

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          clang --version

      - name: Build GenTL ABI package
        run: swift build --package-path swift/Packages/GenTLABI

      - name: Run package tests
        run: swift test --package-path "${{ matrix.path }}" --parallel

      - name: Build macOS camera probe
        if: matrix.package == 'AmcamGenTL'
        run: |
          swift build --package-path "${{ matrix.path }}" --configuration release --product amcam-camera-probe
          bin_path="$(swift build --package-path "${{ matrix.path }}" --configuration release --show-bin-path)"
          mkdir -p "$RUNNER_TEMP/amcam-camera-probe"
          cp "$bin_path/amcam-camera-probe" "$RUNNER_TEMP/amcam-camera-probe/"
          cp swift/docs/AMCAM_MACOS_CAMERA_PROBE.md "$RUNNER_TEMP/amcam-camera-probe/README.md"
          file "$bin_path/amcam-camera-probe"
          "$bin_path/amcam-camera-probe" --help

      - name: Upload macOS camera probe
        if: matrix.package == 'AmcamGenTL'
        uses: actions/upload-artifact@v4
        with:
          name: amcam-camera-probe-macos-arm64
          path: ${{ runner.temp }}/amcam-camera-probe/
          retention-days: 14

  portable-contract-tests:
    name: GenTL ABI and API contract (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Record toolchain
        run: |
          uname -a
          swift --version
          clang --version

      - name: Build GenTL ABI package
        run: swift build --package-path swift/Packages/GenTLABI

      - name: Run GenTL API contract tests
        run: swift test --package-path swift/Packages/GenTLAPI
