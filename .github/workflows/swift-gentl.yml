name: Amcam macOS camera and imaging application

on:
  push:
    branches:
      - swift-gentl-api
      - amcam-multiplatform
      - macos-version-optimization
    paths:
      - "swift/Packages/**"
      - "swift/Apps/**"
      - "swift/docs/**"
      - ".github/workflows/swift-gentl.yml"
  pull_request:
    branches:
      - swift-gentl-api
      - macos-version-optimization
    paths:
      - "swift/Packages/**"
      - "swift/Apps/**"
      - "swift/docs/**"
      - ".github/workflows/swift-gentl.yml"
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest pending validation run for this branch. A currently
# running run is allowed to finish; superseded queued runs are replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-tests:
    name: ${{ matrix.package }} tests
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AmcamCameraModel
            path: swift/Packages/AmcamCameraModel
          - package: GenTLAPI
            path: swift/Packages/GenTLAPI
          - package: GenTLNative
            path: swift/Packages/GenTLNative
          - package: GenTLRouter
            path: swift/Packages/GenTLRouter
          - package: AmcamGenTL
            path: swift/Packages/AmcamGenTL

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          clang --version

      - name: Build GenTL ABI package
        run: swift build --package-path swift/Packages/GenTLABI

      - name: Run package tests
        run: swift test --package-path "${{ matrix.path }}" --parallel

      - name: Build macOS camera probe
        if: matrix.package == 'AmcamGenTL'
        run: |
          swift build --package-path "${{ matrix.path }}" --configuration release --product amcam-camera-probe
          bin_path="$(swift build --package-path "${{ matrix.path }}" --configuration release --show-bin-path)"
          mkdir -p "$RUNNER_TEMP/amcam-camera-probe"
          cp "$bin_path/amcam-camera-probe" "$RUNNER_TEMP/amcam-camera-probe/"
          cp swift/docs/AMCAM_MACOS_CAMERA_PROBE.md "$RUNNER_TEMP/amcam-camera-probe/README.md"
          file "$bin_path/amcam-camera-probe"
          "$bin_path/amcam-camera-probe" --help

      - name: Upload macOS camera probe
        if: matrix.package == 'AmcamGenTL'
        uses: actions/upload-artifact@v4
        with:
          name: amcam-camera-probe-macos-arm64
          path: ${{ runner.temp }}/amcam-camera-probe/
          retention-days: 14

      - name: Enforce routed application dependency boundary
        if: matrix.package == 'AmcamGenTL'
        shell: bash
        run: |
          if grep -R -nE 'import AmcamGenTL|AmcamCameraDriver|AmcamCameraSession' swift/Apps/AmcamImagingApp/Sources; then
            echo "The application must not depend on or instantiate backend implementation types." >&2
            exit 1
          fi
          if grep -q 'AmcamGenTL' swift/Apps/AmcamImagingApp/Package.swift; then
            echo "The application package must not depend on AmcamGenTL." >&2
            exit 1
          fi
          grep -q 'GenTLRouter' swift/Apps/AmcamImagingApp/Package.swift
          grep -q 'AmcamCameraModel' swift/Apps/AmcamImagingApp/Package.swift

      - name: Build macOS imaging application
        if: matrix.package == 'AmcamGenTL'
        run: |
          swift build --package-path swift/Apps/AmcamImagingApp --configuration release --product amcam-imaging
          bin_path="$(swift build --package-path swift/Apps/AmcamImagingApp --configuration release --show-bin-path)"
          app_root="$RUNNER_TEMP/amcam-imaging"
          app_bundle="$app_root/Amcam Imaging.app"
          mkdir -p "$app_bundle/Contents/MacOS"
          cp "$bin_path/amcam-imaging" "$app_bundle/Contents/MacOS/amcam-imaging"
          cat > "$app_bundle/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>amcam-imaging</string>
            <key>CFBundleIdentifier</key><string>com.amscope.imaging</string>
            <key>CFBundleName</key><string>Amcam Imaging</string>
            <key>CFBundleDisplayName</key><string>Amcam Imaging</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>0.1.0</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app_bundle"
          codesign --verify --deep --strict "$app_bundle"
          file "$app_bundle/Contents/MacOS/amcam-imaging" | grep -q "Mach-O 64-bit executable arm64"
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "$app_root/Amcam-Imaging-macos-arm64.zip"
          cat > "$app_root/RUN-THIS-TODAY.txt" <<'README'
          AmScope Imaging — Apple Silicon
          
          1. Extract Amcam-Imaging-macos-arm64.zip.
          2. Open Amcam Imaging.app.
          3. Use SDK… in the camera dock to choose your vendor libamcam.dylib if it is not found automatically.
          4. Select your camera and press Start.
          5. Open Settings to see the controls confirmed for that exact camera.
          
          The vendor SDK is not bundled. Use the Amcam SDK version 58.28273.20250415.
          This application is ad-hoc signed for local testing and is not notarized.
          README

      - name: Upload macOS imaging application
        if: matrix.package == 'AmcamGenTL'
        uses: actions/upload-artifact@v4
        with:
          name: amcam-imaging-macos-arm64
          path: |
            ${{ runner.temp }}/amcam-imaging/Amcam-Imaging-macos-arm64.zip
            ${{ runner.temp }}/amcam-imaging/RUN-THIS-TODAY.txt
          retention-days: 14

      - name: Package camera probe for public distribution
        if: matrix.package == 'AmcamGenTL'
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/amcam-camera-probe" "$RUNNER_TEMP/amcam-camera-probe-macos-arm64.zip"

      - name: Publish public macOS release assets
        if: matrix.package == 'AmcamGenTL' && github.event_name != 'pull_request' && github.ref == 'refs/heads/macos-version-optimization'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: macOS build ${{ github.run_number }}.${{ github.run_attempt }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/amcam-imaging/Amcam-Imaging-macos-arm64.zip
            ${{ runner.temp }}/amcam-imaging/RUN-THIS-TODAY.txt
            ${{ runner.temp }}/amcam-camera-probe-macos-arm64.zip

