name: Amcam macOS camera and imaging application

on:
  push:
    branches:
      - swift-gentl-api
      - amcam-multiplatform
      - macos-version-optimization
    paths:
      - "swift/Packages/**"
      - "swift/Apps/**"
      - "swift/docs/**"
      - "scripts/**"
      - "vendor/**"
      - "README.md"
      - ".github/workflows/swift-gentl.yml"
  pull_request:
    branches:
      - main
      - swift-gentl-api
      - macos-version-optimization
    paths:
      - "swift/Packages/**"
      - "swift/Apps/**"
      - "swift/docs/**"
      - "scripts/**"
      - "vendor/**"
      - "README.md"
      - ".github/workflows/swift-gentl.yml"
  workflow_dispatch:

permissions:
  contents: read

# Keep validation runs isolated by branch. v6 bypasses the stale v5 queue,
# whose runtime test run is blocked by the superseded fail-fast close test.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-runtime-feature-v6
  cancel-in-progress: false

jobs:
  portable-imaging-core-linux:
    name: Portable imaging and runtime-library Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      - name: Build and test portable imaging core
        run: swift test --package-path swift/Packages/AmcamImagingCore

      - name: Build and test portable imaging runtime
        run: swift test --package-path swift/Packages/AmcamImagingRuntime

  package-tests:
    name: ${{ matrix.package }} tests
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: AmcamCameraModel
            path: swift/Packages/AmcamCameraModel
          - package: AmcamImagingCore
            path: swift/Packages/AmcamImagingCore
          - package: AmcamImagingRuntime
            path: swift/Packages/AmcamImagingRuntime
          - package: AmcamImagingGenTLAdapter
            path: swift/Packages/AmcamImagingGenTLAdapter
          - package: AmcamImagingState
            path: swift/Packages/AmcamImagingState
          - package: GenTLAPI
            path: swift/Packages/GenTLAPI
          - package: GenTLNative
            path: swift/Packages/GenTLNative
          - package: GenTLRouter
            path: swift/Packages/GenTLRouter
          - package: AmcamGenTL
            path: swift/Packages/AmcamGenTL

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          clang --version

      - name: Build GenTL ABI package
        run: swift build --package-path swift/Packages/GenTLABI

      - name: Run package tests
        run: swift test --package-path "${{ matrix.path }}" --parallel

      - name: Build macOS camera probe
        if: matrix.package == 'AmcamGenTL'
        run: |
          swift build --package-path "${{ matrix.path }}" --configuration release --product amcam-camera-probe
          bin_path="$(swift build --package-path "${{ matrix.path }}" --configuration release --show-bin-path)"
          mkdir -p "$RUNNER_TEMP/amcam-camera-probe"
          cp "$bin_path/amcam-camera-probe" "$RUNNER_TEMP/amcam-camera-probe/"
          cp swift/docs/AMCAM_MACOS_CAMERA_PROBE.md "$RUNNER_TEMP/amcam-camera-probe/README.md"
          file "$bin_path/amcam-camera-probe"
          "$bin_path/amcam-camera-probe" --help

      - name: Enforce routed application dependency boundary
        if: matrix.package == 'AmcamGenTL'
        shell: bash
        run: |
          if grep -R -nE 'import AmcamGenTL|AmcamCameraDriver|AmcamCameraSession' swift/Apps/AmcamImagingApp/Sources; then
            echo "The application must not depend on or instantiate backend implementation types." >&2
            exit 1
          fi
          if grep -R -nE 'GenTLAcquisitionSession|GenTLFrame|candidate[.]open[(]access:|deviceSession[.]close[(]' swift/Apps/AmcamImagingApp/Sources; then
            echo "The frontend must not open, own, or read from GenTL acquisition resources directly." >&2
            exit 1
          fi
          if grep -R -nE 'import GenTLABI|import GenTLAPI|import GenTLRouter|GenTLDeviceSession|GenTLFeatureKind|GenTLFeatureValue|GenTLFeatureDescriptor|GenTLFeatureAccess' swift/Apps/AmcamImagingApp/Sources; then
            echo "The application must use the imaging runtime feature contract, not GenTL feature/session types." >&2
            exit 1
          fi
          grep -q 'AmcamImagingRuntime' swift/Apps/AmcamImagingApp/Package.swift
          grep -q 'AmcamImagingGenTLAdapter' swift/Apps/AmcamImagingApp/Package.swift
          if grep -q 'AmcamGenTL' swift/Apps/AmcamImagingApp/Package.swift; then
            echo "The application package must not depend on AmcamGenTL." >&2
            exit 1
          fi
          if grep -q 'GenTLRouter' swift/Apps/AmcamImagingApp/Package.swift; then
            echo "GenTLRouter must remain behind the imaging adapter." >&2
            exit 1
          fi
          grep -q 'GenTLRouter' swift/Packages/AmcamImagingGenTLAdapter/Package.swift
          grep -q 'AmcamCameraModel' swift/Apps/AmcamImagingApp/Package.swift
          if grep -R -nE 'NSOpenPanel|chooseSDK|sdkPath|configureSDK[(]at:' swift/Apps/AmcamImagingApp/Sources; then
            echo "The UI must not select or retain native vendor library paths." >&2
            exit 1
          fi
          grep -q 'registerAmcam(backendID: backendID)' swift/Packages/AmcamImagingGenTLAdapter/Sources/AmcamImagingGenTLAdapter/AmcamCameraProvider.swift
          grep -q 'AmcamCameraProvider()' swift/Apps/AmcamImagingApp/Sources/AmcamImagingApp/CameraApplicationModel.swift
          grep -q 'AmcamImagingState' swift/Apps/AmcamImagingApp/Package.swift
          grep -q 'AmcamSDKLibraryLocator.locate()' swift/Packages/GenTLRouter/Sources/GenTLRouter/GenTLRouter.swift
          grep -q 'Contents/Frameworks/Vendors' scripts/build-and-run-macos.sh
          grep -q 'codesign --force --sign -' scripts/build-and-run-macos.sh
          grep -q 'lipo -archs' scripts/build-and-run-macos.sh
          grep -q 'AMCAM_SDK_SOURCE' scripts/build-and-run-macos.sh
          grep -q 'REQUIRE_AMCAM_SDK' scripts/build-and-run-macos.sh
          bash -n scripts/build-and-run-macos.sh

      - name: Build and sign a fixture vendor SDK
        if: matrix.package == 'AmcamGenTL'
        run: |
          cat > "$RUNNER_TEMP/amcam-sdk-fixture.c" <<'C'
          int amcam_packaging_fixture(void) { return 42; }
          C
          clang -dynamiclib -arch arm64 "$RUNNER_TEMP/amcam-sdk-fixture.c" -o "$RUNNER_TEMP/libamcam.dylib"
          app_bundle="$RUNNER_TEMP/amcam-imaging/Amcam Imaging.app"
          AMCAM_SDK_SOURCE="$RUNNER_TEMP/libamcam.dylib" REQUIRE_AMCAM_SDK=1 BUILD_ONLY=1 BUILD_CONFIGURATION=release APP_DESTINATION="$app_bundle" scripts/build-and-run-macos.sh
          embedded_sdk="$app_bundle/Contents/Frameworks/Vendors/amcam/macos/libamcam.dylib"
          test -f "$embedded_sdk"
          codesign --verify --strict "$embedded_sdk"
          codesign --verify --deep --strict "$app_bundle"
          file "$app_bundle/Contents/MacOS/amcam-imaging" | grep -q "Mach-O 64-bit executable arm64"
